plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

// fabric-api-style version: modversion+mcversion, so every jar names its target game version.
version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    // One run dir per Minecraft line (dev_run_dir in gradle.properties): never let a newer server
    // touch (and upgrade!) an older line's dev world.
    runs {
        server {
            runDir project.dev_run_dir
        }
    }
}

repositories {
    // Loom adds Minecraft + Fabric repositories automatically.
    maven { url = 'https://maven.nucleoid.xyz' } // sgui
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // No mappings dependency: Minecraft 26.x ships un-obfuscated.
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    // sgui — standalone server-side GUI library (vanilla-client compatible, no Polymer needed).
    include(implementation("eu.pb4:sgui:${project.sgui_version}"))

    // Pure-logic unit tests (Postage) — no game runtime required.
    testImplementation platform('org.junit:junit-bom:5.11.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    filteringCharset "UTF-8"
    // fabric.mod.json pins "minecraft" to ~minecraft_version, so a line's jar only loads on its
    // own Minecraft version and porting a line is a gradle.properties change only
    filesMatching("fabric.mod.json") {
        expand "version": project.version, "minecraft_version": project.minecraft_version
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release.set(targetJavaVersion)
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}
