name: build

# One pipeline per supported Minecraft line: main = newest (26.3), 26.x branches = backports.
on:
  push:
    branches: [main, '26.*']
  pull_request:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only used to push README badge data to the `badges` branch (release lines)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - name: Minecraft version
        run: |
          MC=$(grep -E '^minecraft_version=' gradle.properties | cut -d= -f2)
          echo "MC_VERSION=$MC" >> "$GITHUB_ENV"
          echo "### postbox on Minecraft $MC (\`$GITHUB_REF_NAME\`)" >> "$GITHUB_STEP_SUMMARY"
      - name: Build + tests
        run: ./gradlew build
      - name: Diagnose mappings (only on failure)
        if: failure()
        run: |
          J=$(find ~/.gradle/caches/fabric-loom -name "*minecraft*.jar" 2>/dev/null | grep -viE "sources|javadoc|intermediary" | head -1)
          echo "== $J"
          echo "== dialog inputs"
          javap -cp "$J" net.minecraft.server.dialog.CommonDialogData 2>/dev/null | head -8
          javap -cp "$J" net.minecraft.server.dialog.Input 2>/dev/null | head -8
          javap -cp "$J" net.minecraft.server.dialog.input.TextInput 2>/dev/null | head -10
          javap -cp "$J" net.minecraft.server.dialog.input.SingleOptionInput 2>/dev/null | head -10
          javap -cp "$J" net.minecraft.server.dialog.input.BooleanInput 2>/dev/null | head -8
          javap -cp "$J" net.minecraft.server.dialog.input.NumberRangeInput 2>/dev/null | head -8
          javap -cp "$J" net.minecraft.server.dialog.action.CommandTemplate 2>/dev/null | head -8
          javap -cp "$J" net.minecraft.server.dialog.action.ParsedTemplate 2>/dev/null | head -8
          unzip -l "$J" 2>/dev/null | grep "server/dialog" | head -30 || true
          echo "== book components"
          javap -cp "$J" net.minecraft.world.item.component.WrittenBookContent 2>/dev/null | grep -iE "public net|pages" | head -6
          javap -cp "$J" net.minecraft.world.item.component.WritableBookContent 2>/dev/null | grep -iE "public net|pages" | head -6
          javap -cp "$J" net.minecraft.world.item.component.BundleContents 2>/dev/null | grep -iE "public net|static" | head -8
          javap -cp "$J" net.minecraft.world.item.ItemStackTemplate 2>/dev/null | grep "public" | head -6
          echo "== entities"
          unzip -l "$J" 2>/dev/null | grep -iE "WanderingTrader.class|TraderLlama.class|Interaction.class" | head -6 || true
          javap -cp "$J" net.minecraft.world.entity.EntityTypes 2>/dev/null | grep -iE "WANDERING|TRADER" | head -4
          javap -cp "$J" net.minecraft.world.entity.ai.navigation.PathNavigation 2>/dev/null | grep moveTo | head -4
          echo "== skull / profile"
          javap -cp "$J" net.minecraft.world.level.block.entity.SkullBlockEntity 2>/dev/null | grep -iE "profile" | head -4
          javap -cp "$J" net.minecraft.world.item.component.ResolvableProfile 2>/dev/null | grep -iE "public static|name" | head -6
          echo "== misc"
          javap -cp "$J" net.minecraft.server.MinecraftServer 2>/dev/null | grep -iE "getServerDirectory|services" | head -4
          javap -cp "$J" net.minecraft.world.level.Level 2>/dev/null | grep -iE "time|dimension" | head -8
      - name: Test summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, re, sys
          t = f = e = s = 0
          for p in glob.glob('build/test-results/test/*.xml'):
              head = open(p, encoding='utf-8').read(4096)
              m = re.search(r'tests="(\d+)" skipped="(\d+)" failures="(\d+)" errors="(\d+)"', head)
              t += int(m[1]); s += int(m[2]); f += int(m[3]); e += int(m[4])
          print(f"Unit tests: **{t}** run, {f} failed, {e} errors, {s} skipped")
          if t == 0:
              print("::error::no unit tests ran", file=sys.stderr)
              sys.exit(1)
          PY
      # Boot a real Fabric server twice (newest release of this line, newest fabric-api) and drive
      # it through the console. Writes build/server-test/versions.json for the badges below.
      - name: Server test (real Fabric server)
        run: python3 scripts/server_test.py
      - name: Upload server-test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: server-test-log-${{ env.MC_VERSION }}
          path: build/server-test/console.log
          if-no-files-found: ignore
      # README badges per release line (scripts/publish_badges.py -> orphan `badges` branch).
      # Pushes to a release line only: a PR or feature branch must never overwrite what they report.
      - name: Publish version badges
        if: always() && github.event_name == 'push' && (github.ref_name == 'main' || startsWith(github.ref_name, '26.')) && hashFiles('build/server-test/versions.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 scripts/publish_badges.py --branch "$GITHUB_REF_NAME" --out /tmp/badges
          bash scripts/commit_badges.sh /tmp/badges "$GITHUB_REF_NAME @ ${GITHUB_SHA::7}" || true
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ env.MC_VERSION }}
          path: build/reports/tests/test
          if-no-files-found: ignore
      - name: Artifact slug
        run: echo "ARTIFACT_SLUG=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_ENV"
      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: postbox-${{ env.MC_VERSION }}-${{ env.ARTIFACT_SLUG }}
          path: build/libs/*.jar
